[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cozmo-floorplan"
version = "0.1.0"
description = "Handheld iPhone capture to a dimensioned floor plan (Cozmo case study)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pillow>=10.0",
  "pydantic>=2.0",
  "opencv-python>=4.8,<4.11",
  "ultralytics>=8.2",
]

[project.optional-dependencies]
vggt = [
  "torch>=2.2",
  "torchvision>=0.17",
  "huggingface_hub>=0.23",
  "einops>=0.7",
  "safetensors>=0.4",
]

[project.scripts]
cozmo = "cozmo.cli:main"

[tool.setuptools.packages.find]
include = ["cozmo*"]
